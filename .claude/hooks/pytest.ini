[pytest]
# These assert properties of the FULL private monorepo, not of the hook logic: more than 100 registrations, a
# SessionStart event, the todo hooks, .husky/pre-commit, apps/api/src/research and the DRY detector under apps/api.
# The 13 hooks shipped here, their helpers and every other test of theirs run.
addopts =
    -p no:cacheprovider
    --deselect=test_hook_mode_gate.py::test_always_on_set_names_only_real_hooks
    --deselect=test_hook_mode_gate.py::test_self_gating_detection_selects_the_real_todo_hooks
    --deselect=test_hook_mode_gate.py::test_the_scan_finds_registrations
    --deselect=test_hook_mode_gate.py::test_settings_json_is_still_valid_json
    --deselect=test_hook_mode_gate.py::test_every_gate_hook_exists_and_is_registered
    --deselect=test_hook_mode_gate.py::test_the_dry_door_judges_a_gortex_write_like_a_write
    --deselect=test_hook_mode_gate.py::test_a_gortex_batch_is_judged_entry_by_entry_and_the_first_deny_is_the_answer
    --deselect=test_outside_repo_python_guard.py::TestInlineCodeReachingTheRepoIsRefusedHoweverItIsSpelled::test_every_spelling_is_refused
    --deselect=test_scoped_stage_guard.py::TestPathsResolveAgainstTheCommandsCwdNotTheHooks::test_an_extensionless_file_is_a_file_when_the_payload_cwd_is_the_repo
    --deselect=test_scoped_stage_guard.py::TestPathsResolveAgainstTheCommandsCwdNotTheHooks::test_a_cd_segment_moves_the_resolution_base
