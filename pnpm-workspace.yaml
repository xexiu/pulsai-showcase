packages:
  - web
  - packages/shared
# Dependency build scripts stay off: none is needed to type-check or test (Next's file watcher, its SWC binary,
# an old polyfill), and pnpm runs no third-party install script unless it is listed here as true.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  es5-ext: false

overrides:
  # GHSA-g3hv-75wg-m249: minimatch 7.0.0 up to 11.0.1 (pulled in by typescript-eslint)
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
