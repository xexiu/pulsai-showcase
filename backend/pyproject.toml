[project]
name = "pulsai-showcase-backend"
version = "0.1.0"
description = "A runnable slice of the PulsAI backend: a multi-provider LLM layer with RAG context and runtime fallback, AST quality gates for AI-generated code, ML validation and backtest metrics, numba indicators, and resilient Redis/HTTP infrastructure."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "anthropic==0.89.0",
    "ccxt==4.5.88",
    "celery==5.6.3",
    "fastapi==0.135.3",
    "google-genai==1.70.0",
    "groq==1.1.2",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "numba==0.65.0",
    "numpy==2.4.6",
    "openai==2.30.0",
    "orjson==3.13.0",
    "pandas==3.0.2",
    "polars==1.39.3",
    "prometheus-client==0.25.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
    "pyyaml==6.0.3",
    "redis==6.4.0",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "sqlalchemy==2.0.49",
    "together==2.7.0",
]

[dependency-groups]
dev = [
    "fakeredis==2.35.1",
    "mypy==1.19.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "ruff==0.15.6",
    "types-redis==4.6.0.20241004",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (may use database)",
    "db: Tests requiring a live database marker selection",
    "slow: Slow tests (ML training, backtesting)",
    "e2e: End-to-end tests",
    "asyncio: Async tests using pytest-asyncio",
    "anyio: Async tests using anyio",
    "no_parallel: Must run serially (shares DB/Redis state)",
    "real_signal_roster: Opt out of the autouse tier-scan stub so the roster wiring runs for real",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers", "-ra", "--tb=short",
    # These assert that the gates are WIRED into the private monorepo -- they read its verify.sh, ci.yml, pyright
