# =============================================================================
# AI Sources Configuration (Sprint 1.7)
# =============================================================================
# Curated sources for RAG context - NO random internet scraping
# Only trusted, verified sources to prevent hallucinations and manipulation
# =============================================================================

version: '1.0'
description: 'Curated sources for AI context - controlled RAG architecture'

# =============================================================================
# Internal Data Sources (PulsAI's own data)
# =============================================================================
# DESIGN DECISION (2026-01-29): NOT including api_response history
# WHY: Primary use case is "explain THIS signal", not conversation history
# PROS of api_response: Conversation continuity, personalization
# CONS: Privacy risk, token cost, complexity, scope creep
# REVISIT: If users request chat memory feature
# =============================================================================
internal_sources:
  enabled: true
  include:
    - signals # ML signal history (action, confidence, timestamp)
    - models # Model metrics (accuracy, sharpe, win_rate)
    - charts # OHLCV data (last N candles)
    - indicators # TA indicators (RSI, MACD, BB values)
    - sentiment # Fear & Greed index, market sentiment
    # NOT included (by design):
    # - api_response  # User's API call history (privacy, cost, complexity)

# =============================================================================
# External Data Sources (Curated, trusted only)
# =============================================================================
# DESIGN DECISION (2026-01-29): Start minimal, expand based on user feedback
# MVP sources: News (Financial Juice), Education (Pattern Site), Macro (FED, BLS)
# FUTURE candidates:
#   - CoinGlass (liquidations, OI, funding) - free tier, crypto-specific
#   - CME FedWatch (rate probabilities) - market expectations
#   - DeFi Llama (TVL) - DeFi context
# NOT adding yet:
#   - Glassnode - requires paid subscription
#   - TradingView - complex API
# REASONING: More sources = more tokens = higher cost per AI call
# =============================================================================
external_sources:
  enabled: true
  refresh_interval_minutes: 15
  cache_ttl_minutes: 30

