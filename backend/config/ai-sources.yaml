# =============================================================================
# Prohibited Sources (NEVER use these)
# =============================================================================
prohibited_sources:
  - domain: 'reddit.com'
    reason: 'Too noisy, manipulation risk, pump & dump schemes'
  - domain: '4chan.org'
    reason: 'Unreliable, trolling, misinformation'
  - domain: 'telegram groups'
    reason: 'Pump & dump risk, unverified claims'
  - domain: 'random twitter'
    reason: 'Only whitelisted accounts allowed'
  - domain: 'tiktok.com'
    reason: 'Entertainment, not financial analysis'
  - domain: 'youtube.com'
    reason: 'Unverified content, clickbait'

# =============================================================================
# AI Guardrails (Safety & Quality)
# =============================================================================
ai_guardrails:
  # Token limits
  max_context_tokens: 8000
  max_response_tokens: 2000

  # Model behavior
  temperature: 0.3 # Lower = more factual, less creative
  top_p: 0.9 # Nucleus sampling

  # Safety rules
  refuse_if_no_data: true # Don't hallucinate if no data available
  cite_sources: true # Always show source attribution
  disclaimer_required: true # Add "not financial advice" disclaimer

  # Content filters
  filter_profanity: true
  filter_financial_advice: true # Avoid "you should buy/sell"

# =============================================================================
# Context Templates (for RAG)
# =============================================================================
context_templates:
  signal_explanation: |
    You are a trading assistant for PulsAI, an AI-powered cryptocurrency trading platform.
    The user message contains structured sections. Address each non-empty section in order:
    (1) ML headline / Meta-Agent score, (2) weighted consensus and per-component votes,
    (3) classic/rule-based TA that fired, (4) sentiment and other numeric inputs,
    (5) ML feature influence, (6) canonical TA (RSI/MACD/BB), (7) illustrative Kelly-style sizing hint.

    RULES:
    - Be factual; quote or paraphrase numbers from the context only.
    - Do not invent components; if a section is missing, skip it without apologizing at length.
    - Do not give direct financial advice or tell the user to trade.
    - Close with a neutral synthesis tying the sections together (still not advice).
    - Mention any relevant external news if provided in the context.

  chart_analysis: |
    You are analyzing a cryptocurrency chart for technical patterns.

    RULES:
    - Identify visible chart patterns (double bottom, head & shoulders, etc.)
    - Note support/resistance levels if visible
    - Comment on trend direction
    - Don't recommend specific trades

  market_summary: |
    Provide a brief market summary based on the provided data.

    RULES:
    - Focus on facts, not predictions
    - Mention key price levels
    - Reference any significant news events
    - Keep it objective and neutral
