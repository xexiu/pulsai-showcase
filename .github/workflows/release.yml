# IMPORTERS/CALLERS: GitHub Actions, on a pushed v* tag. AFFECTED API: none. DATA SCHEMAS: none.
# Publishes the source archive of a tag with a signed SLSA build-provenance attestation beside it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the attestation with Sigstore
      attestations: write # record the attestation on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the source archive
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="pulsai-showcase-${GITHUB_REF_NAME}/" \
            -o "dist/pulsai-showcase-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_SHA}"
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "${BUNDLE_PATH}" "dist/pulsai-showcase-${GITHUB_REF_NAME}.intoto.jsonl"
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
