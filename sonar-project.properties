sonar.organization=xexiu
sonar.projectKey=xexiu_pulsai-showcase
sonar.projectName=pulsai-showcase
sonar.sources=backend/src,web/src,packages/shared/src
sonar.tests=backend/tests,web/tests
sonar.python.version=3.14
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
# Coverage scope = the monorepo policy (docs/05-testing/COVERAGE_REQUIREMENTS.md): React components are covered by
# component / E2E tests, Plotly glue by chart QA, barrels hold no logic -- none of them in the unit coverage gate.
sonar.coverage.exclusions=web/src/components/**,web/src/utils/plotly-chart-helpers/**,**/index.ts
